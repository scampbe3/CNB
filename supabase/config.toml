project_id = "cnb-member-portal"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:4180"
additional_redirect_urls = ["http://localhost:4180/auth/confirm"]
enable_signup = false
minimum_password_length = 12
[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
[auth.email.template.invite]
subject = "Your place in The Decision Room"
content_path = "./supabase/templates/invite.html"
[auth.email.template.recovery]
subject = "Your Decision Room password"
content_path = "./supabase/templates/recovery.html"
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "7MiB"
