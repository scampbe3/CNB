# Hosted staging only. The repository-root config remains for localhost.
project_id = "cnb-member-portal"
[auth]
enabled = true
site_url = "https://cnb-member-portal.vercel.app"
additional_redirect_urls = ["https://cnb-member-portal.vercel.app/auth/confirm"]
enable_signup = false
minimum_password_length = 12
[auth.email]
# Keep email authentication enabled; auth.enable_signup above blocks registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
[auth.email.smtp]
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "members@cupcakesandbroccoli.com"
sender_name = "The Decision Room"
[auth.email.template.invite]
subject = "Your place in The Decision Room"
content_path = "./supabase/templates/invite.html"
[auth.email.template.recovery]
subject = "Your Decision Room password"
content_path = "./supabase/templates/recovery.html"
